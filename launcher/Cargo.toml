[package]
name = "mushtv-launcher"
version = "0.1.0"
edition = "2024"
description = "10-foot app launcher for the mushtv box"
publish = false

[dependencies]
anyhow = "1"
chrono = "0.4"
evdev = "0.13"
# Not used directly: enables runtime dlopen of fontconfig for Slint's font
# lookup, so building needs no pkg-config or libfontconfig-dev.
fontique = { version = "0.11", default-features = false, features = ["system", "fontconfig-dlopen"] }
inotify = "0.11"
nix = { version = "0.31", features = ["signal", "process"] }
signal-hook = "0.3"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit-wayland", "renderer-femtovg"] }
toml = "1"
zbus = "5"
tracing = "0.1"
tracing-journald = "0.3"
tracing-subscriber = "0.3"

[build-dependencies]
slint-build = "1.18"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true

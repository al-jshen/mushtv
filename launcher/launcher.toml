# mushtv launcher configuration.
#
# This file in the repo is the source of truth; `sudo ./deploy.sh` installs it
# to /etc/mushtv/launcher.toml. Tiles appear in the order listed, in even rows
# of up to five (Up/Down move between rows).

[launcher]
clock = "24h"                 # "24h" or "12h"
home_keys = ["KEY_HOMEPAGE", "KEY_F12"]  # evdev key names that return to the launcher from any app
guide_hold_ms = 1000          # hold a gamepad's Guide button this long to return home

# Each tile:
#   id            unique, [a-z0-9-]; app logs go to `journalctl -t mushtv-<id>`
#   name          shown under the tile
#   command       program and arguments (a list, not a shell string).
#                 `flatpak run` commands get --die-with-parent added automatically.
#   [[tile.choice]] instead of command: two or more, each with a `name` and a
#                 `command`. Opening the tile asks which one (Settings-style
#                 list), starting on the one used last.
#   stop_command  optional; tried first when you press Home, before SIGTERM
#   icon          optional; a path, relative to /usr/local/share/mushtv/.
#                 Without it, Flatpak apps use their own icon.
#   color         optional tile background, "#rrggbb"

[[tile]]
id = "youtube"
name = "YouTube"
command = ["flatpak", "run", "rocks.shy.VacuumTube", "--fullscreen"]
icon = "youtube.svg"
color = "#1f1f1f"

[[tile]]
id = "jellyfin"
name = "Jellyfin"
command = ["flatpak", "run", "com.github.iwalton3.jellyfin-mpv-shim"]
stop_command = ["flatpak", "run", "--command=jellyfin-mpv-shim", "com.github.iwalton3.jellyfin-mpv-shim", "stop"]
color = "#101b2e"

# Streams Steam from the gaming PC over Tailscale, from one of its two Wolf
# servers (see server/spc/README.md): "spc" renders on the RTX 4060, "spc-igpu"
# on the integrated graphics, which a game at spc's desk doesn't need. Both
# share one Steam. Home disconnects but leaves the game running on spc
# (--no-quit-after); exiting Steam ends the session and returns here.
[[tile]]
id = "steam"
name = "Steam"
icon = "steam.svg"
color = "#1b2838"

[[tile.choice]]
name = "Graphics card (RTX 4060)"
command = ["flatpak", "run", "com.moonlight_stream.Moonlight", "stream", "spc", "Steam",
           "--1080", "--fps", "60", "--display-mode", "fullscreen", "--multi-controller", "--no-quit-after"]

[[tile.choice]]
name = "Integrated graphics card"
command = ["flatpak", "run", "com.moonlight_stream.Moonlight", "stream", "spc-igpu", "Steam",
           "--1080", "--fps", "60", "--display-mode", "fullscreen", "--multi-controller", "--no-quit-after"]

[[tile]]
id = "moonlight"
name = "Moonlight"
command = ["flatpak", "run", "com.moonlight_stream.Moonlight"]
color = "#14202b"

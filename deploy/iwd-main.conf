# mushtv: iwd only joins Wi-Fi networks. ifupdown and dhcpcd still do DHCP
# and routes for wlp2s0 (metric 600, so Ethernet stays first). Installed by
# deploy.sh as /etc/iwd/main.conf.
[General]
EnableNetworkConfiguration=false

# Use the kernel's interface (wlp2s0). By default iwd deletes it at start
# and creates its own, wlan0, which ifupdown doesn't know.
[DriverQuirks]
DefaultInterface=*

# mushtv: the TV session's audio outputs. Installed by deploy.sh into
# ~tv/.config/wireplumber/wireplumber.conf.d/.
#
# 1. The onboard sound card offers analog and HDMI as separate profiles, and
#    WirePlumber picks the highest-priority available one by itself: analog,
#    which has no HDMI output at all. This prefers the HDMI profiles instead.
# 2. Bluetooth outputs rank below HDMI, so a speaker that turns on doesn't
#    take over. Choosing it in Settings stores it as the default, and
#    WirePlumber then uses it whenever it's connected.
device.profile.priority.rules = [
  {
    matches = [
      { device.name = "alsa_card.pci-0000_00_1f.3" }
    ]
    actions = {
      update-props = {
        priorities = [
          "output:hdmi-stereo"
          "output:hdmi-stereo+input:analog-stereo"
        ]
      }
    }
  }
]

monitor.bluez.rules = [
  {
    matches = [
      { node.name = "~bluez_output.*" }
    ]
    actions = {
      update-props = {
        priority.session = 100
        priority.driver = 100
      }
    }
  }
]

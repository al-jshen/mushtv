<!-- mushtv: lets the TV's launcher (user tv) manage Wi-Fi through iwd, for
     Settings → Wi-Fi. iwd's own policy allows only root and the sudo and
     netdev groups. Installed by deploy.sh as
     /etc/dbus-1/system.d/mushtv-iwd.conf; the bus picks it up by itself. -->
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="tv">
    <allow send_destination="net.connman.iwd"/>
  </policy>
</busconfig>
